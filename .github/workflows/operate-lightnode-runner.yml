name: Operate LightNode bootstrap runner

on:
  workflow_dispatch:
    inputs:
      host:
        description: Reviewed LightNode runner IPv4 address
        required: true
        type: string
      job_id:
        description: Immutable bootstrap job ID
        required: true
        type: string
      action:
        description: Read status or approve the reviewed fingerprint
        required: true
        type: choice
        options:
          - status
          - approve
          - diagnose
      fingerprint:
        description: Required SHA256 fingerprint for approval
        required: false
        type: string

permissions: {}

concurrency:
  group: operate-lightnode-staging-runner
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Prepare strict SSH identity
        env:
          HOST: ${{ inputs.host }}
          INITIAL_SSH_KEY: ${{ secrets.LIGHTNODE_RUNNER_INITIAL_SSH_KEY }}
        run: |
          [[ "$HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          test -n "$INITIAL_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$INITIAL_SSH_KEY" >"$HOME/.ssh/id_rsa"
          chmod 0600 "$HOME/.ssh/id_rsa"
          ssh-keyscan -T 15 -t ed25519 "$HOST" >"$HOME/.ssh/known_hosts"
          test "$(wc -l <"$HOME/.ssh/known_hosts")" -eq 1
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256
      - name: Invoke loopback-only operator endpoint
        env:
          HOST: ${{ inputs.host }}
          JOB_ID: ${{ inputs.job_id }}
          ACTION: ${{ inputs.action }}
          FINGERPRINT: ${{ inputs.fingerprint }}
          APPROVAL_SECRET: ${{ secrets.LIGHTNODE_RUNNER_APPROVAL_SECRET }}
        run: |
          [[ "$JOB_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$ ]]
          [[ "$ACTION" == status || "$ACTION" == approve || "$ACTION" == diagnose ]]
          if [[ "$ACTION" == approve ]]; then
            [[ "$FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          else
            test -z "$FINGERPRINT"
          fi
          if [[ "$ACTION" == diagnose ]]; then
            ssh -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes "root@$HOST" \
              "set -a
               . /etc/xmcl-lightnode-bootstrap-runner.env
               set +a
               job_root=\"\$XMCL_LIGHTNODE_RUNNER_STATE_ROOT/jobs/$JOB_ID\"
               export XMCL_LIGHTNODE_HOST=\$(jq -r .address \"\$job_root/request.json\")
               export XMCL_LIGHTNODE_PORT=\"\$XMCL_LIGHTNODE_SSH_PORT\"
               export XMCL_LIGHTNODE_USER=\"\$XMCL_LIGHTNODE_SSH_USER\"
               export XMCL_LIGHTNODE_PRIVATE_KEY
               export XMCL_LIGHTNODE_KNOWN_HOSTS=\"\$job_root/known_hosts\"
               export XMCL_LIGHTNODE_HOST_KEY_SHA256=\$(cat \"\$job_root/fingerprint\")
               export XMCL_LIGHTNODE_BOOTSTRAP_ENV=\"\$job_root/bootstrap.env\"
               export XMCL_LIGHTNODE_BOOTSTRAP_SCRIPT
               export XMCL_LIGHTNODE_AGENT_SERVICE
               \"\$XMCL_LIGHTNODE_RUNNER_SCRIPT\" apply"
          elif [[ "$ACTION" == approve ]]; then
            printf '%s\n' "$APPROVAL_SECRET" |
              ssh -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes "root@$HOST" \
                "read -r secret
                 curl --fail-with-body --silent --show-error \
                   --header \"Authorization: Bearer \$secret\" \
                   --header 'Content-Type: application/json' \
                   --request POST \
                   --data '{\"fingerprint\":\"$FINGERPRINT\"}' \
                   'http://127.0.0.1:8088/v1/bootstrap-jobs/$JOB_ID/approve'"
          else
            printf '%s\n' "$APPROVAL_SECRET" |
              ssh -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes "root@$HOST" \
                "read -r secret
                 curl --fail-with-body --silent --show-error \
                   --header \"Authorization: Bearer \$secret\" \
                   --header 'Content-Type: application/json' \
                   --request POST \
                   'http://127.0.0.1:8088/v1/bootstrap-jobs/$JOB_ID/status'"
          fi
