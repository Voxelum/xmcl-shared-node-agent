name: Validate shared node runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test Go components
        run: go test ./...
      - name: Test compiler service
        working-directory: compiler
        run: npm test && npm run check
      - name: Validate compiler/runtime catalog binding
        run: >-
          node compiler/scripts/validate_toolchain_catalog.mjs
          --runtime-catalog-lock runtime-image/runtime-catalog.lock.json
      - name: Test runtime catalog resolution
        run: python3 -m unittest discover -s runtime-image/tests -v
      - name: Validate reviewed runtime inputs
        run: |
          python3 runtime-image/scripts/validate_runtime_assets.py
          python3 runtime-image/scripts/validate_runtime_catalog.py
          python3 runtime-image/scripts/sync_agent_catalog.py --check
