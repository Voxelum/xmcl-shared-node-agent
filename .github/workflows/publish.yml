name: Publish shared node runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-shared-node-runtime
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: runtime-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate release tag and reviewed inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # This branch is an isolated test publication, never a production/default release.
          test "$GITHUB_REF" = "refs/heads/test/lightnode-20261019-r1"
          test "$RELEASE_TAG" = "v0.3.22-lightnode.20261019.2"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          existing_tags=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          # The publisher creates a new lightweight tag first; never create or replace it here.
          test -n "$existing_tags"
          test "$(cut -f1 <<<"$existing_tags")" = "$GITHUB_SHA"
          existing_releases=$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "$RELEASE_TAG" <<<"$existing_releases"; then
            echo "release already exists; refusing publication" >&2
            exit 1
          fi
          go test ./...
          (cd compiler && node --test test/agent-builder.test.mjs \
            test/process-quiescer.test.mjs \
            test/jre-materializer.test.mjs \
            test/production-adapters.test.mjs \
            test/reviewed-builder.test.mjs \
            test/verified-jre-mount.test.mjs)
          (cd compiler && node test/compiler.test.mjs)
          python3 scripts/test_prerelease_gate.py
          python3 scripts/test_release_manifest.py
          python3 -m unittest discover -s runtime-image/tests -v
          python3 runtime-image/scripts/validate_runtime_assets.py
          python3 runtime-image/scripts/validate_runtime_catalog.py
          python3 runtime-image/scripts/sync_agent_catalog.py --check
          node compiler/scripts/validate_toolchain_catalog.mjs \
            --runtime-catalog-lock runtime-image/runtime-catalog.lock.json
      - name: Build same-commit Linux binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_SHA" \
            -o dist/xmcl-shared-node-agent-linux-amd64 ./cmd/xmcl-shared-node-agent
          go build -trimpath -ldflags "-s -w" \
            -o dist/xmcl-quota-helper-linux-amd64 ./cmd/xmcl-quota-helper
          go build -trimpath -ldflags "-s -w" \
            -o dist/xmcl-shared-minecraft-runtime-linux-amd64 \
            ./cmd/xmcl-shared-minecraft-runtime
          go build -trimpath -ldflags "-s -w" \
            -o dist/xmcl-lightnode-bootstrap-runner-linux-amd64 \
            ./cmd/xmcl-lightnode-bootstrap-runner
          bash -n deploy/lightnode/bootstrap.sh deploy/lightnode/runner.sh
          mkdir -p dist/lightnode-runner
          cp dist/xmcl-lightnode-bootstrap-runner-linux-amd64 \
            dist/lightnode-runner/xmcl-lightnode-bootstrap-runner
          cp deploy/lightnode/bootstrap.sh deploy/lightnode/runner.sh \
            deploy/lightnode/runner.env.example \
            deploy/lightnode/nginx-runner.conf.example \
            deploy/systemd/xmcl-shared-node-agent.service \
            deploy/systemd/xmcl-lightnode-bootstrap-runner.service \
            dist/lightnode-runner/
          chmod 0755 dist/lightnode-runner/bootstrap.sh \
            dist/lightnode-runner/runner.sh
          tar -C dist/lightnode-runner -czf \
            dist/xmcl-lightnode-bootstrap-runner-linux-amd64.tar.gz .
          mkdir -p dist/lightnode-runner-verify
          tar -C dist/lightnode-runner-verify -xzf \
            dist/xmcl-lightnode-bootstrap-runner-linux-amd64.tar.gz
          bash -n dist/lightnode-runner-verify/bootstrap.sh \
            dist/lightnode-runner-verify/runner.sh
          test -x dist/lightnode-runner-verify/bootstrap.sh
          test -x dist/lightnode-runner-verify/runner.sh
      - name: Record observed same-build agent version
        run: python3 scripts/write_agent_version_receipt.py
      - name: Materialize and verify runtime image inputs
        run: |
          python3 runtime-image/scripts/materialize_runtime_assets.py \
            --runtime-binary dist/xmcl-shared-minecraft-runtime-linux-amd64
          python3 runtime-image/scripts/materialize_runtime_catalog.py
          python3 runtime-image/scripts/validate_runtime_assets.py --require-files
          python3 runtime-image/scripts/validate_runtime_catalog.py --require-files
      - name: Validate every Java runtime in the final image base
        run: |
          catalog_sha=$(sha256sum runtime-image/runtime-catalog.lock.json | cut -d' ' -f1)
          docker build --build-arg "RUNTIME_CATALOG_SHA256=$catalog_sha" \
            --tag xmcl-runtime-validation runtime-image
          for major in 8 16 17 21 25; do
            docker run --rm --entrypoint "/opt/xmcl/jre/$major/bin/java" \
              xmcl-runtime-validation -version
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile immutable registry tags
        id: registry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          inspect_tag() {
            local image="$1" output digest
            if output=$(docker buildx imagetools inspect "$image" 2>&1); then
              digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"$output")
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              printf 'present %s\n' "$digest"
            elif grep -Eqi 'not found|manifest unknown' <<<"$output"; then
              printf 'absent -\n'
            else
              echo "$output" >&2
              return 1
            fi
          }
          read -r release_status release_digest < <(inspect_tag \
            "ghcr.io/voxelum/xmcl-shared-minecraft-runtime:$RELEASE_TAG")
          read -r commit_status commit_digest < <(inspect_tag \
            "ghcr.io/voxelum/xmcl-shared-minecraft-runtime:sha-$GITHUB_SHA")
          if [[ "$release_status" == absent && "$commit_status" == absent ]]; then
            echo "existing=false" >> "$GITHUB_OUTPUT"
          elif [[ "$release_status" == present && "$commit_status" == present &&
            "$release_digest" == "$commit_digest" ]]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "digest=$release_digest" >> "$GITHUB_OUTPUT"
          else
            echo "registry tags are partial or conflicting" >&2
            exit 1
          fi
      - name: Record reviewed runtime catalog revision
        id: catalog
        run: |
          echo "sha256=$(sha256sum runtime-image/runtime-catalog.lock.json | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"
          echo "toolchain=$(jq -er '.catalogRevision' compiler/toolchain-catalog.lock.json)" \
            >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        if: steps.registry.outputs.existing != 'true'
        with:
          context: runtime-image
          push: true
          build-args: |
            RUNTIME_CATALOG_SHA256=${{ steps.catalog.outputs.sha256 }}
          tags: |
            ghcr.io/voxelum/xmcl-shared-minecraft-runtime:${{ inputs.tag }}
            ghcr.io/voxelum/xmcl-shared-minecraft-runtime:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Resolve published image digest
        id: image-result
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.registry.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Reconcile immutable builder registry tags
        id: builder-registry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          inspect_tag() {
            local image="$1" output digest
            if output=$(docker buildx imagetools inspect "$image" 2>&1); then
              digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"$output")
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              printf 'present %s\n' "$digest"
            elif grep -Eqi 'not found|manifest unknown' <<<"$output"; then
              printf 'absent -\n'
            else
              echo "$output" >&2
              return 1
            fi
          }
          read -r release_status release_digest < <(inspect_tag \
            "ghcr.io/voxelum/xmcl-shared-node-builder:$RELEASE_TAG")
          read -r commit_status commit_digest < <(inspect_tag \
            "ghcr.io/voxelum/xmcl-shared-node-builder:sha-$GITHUB_SHA")
          if [[ "$release_status" == absent && "$commit_status" == absent ]]; then
            echo "existing=false" >> "$GITHUB_OUTPUT"
          elif [[ "$release_status" == present && "$commit_status" == present &&
            "$release_digest" == "$commit_digest" ]]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "digest=$release_digest" >> "$GITHUB_OUTPUT"
          else
            echo "builder registry tags are partial or conflicting" >&2
            exit 1
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: builder-image
        if: steps.builder-registry.outputs.existing != 'true'
        with:
          context: .
          file: compiler/Dockerfile.builder
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILDER_SCHEMA=agent_builder_v1
            TOOLCHAIN_CATALOG_REVISION=${{ steps.catalog.outputs.toolchain }}
            RUNTIME_CATALOG_REVISION=${{ steps.catalog.outputs.sha256 }}
          tags: |
            ghcr.io/voxelum/xmcl-shared-node-builder:${{ inputs.tag }}
            ghcr.io/voxelum/xmcl-shared-node-builder:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Resolve published builder image digest
        id: builder-image-result
        env:
          BUILT_DIGEST: ${{ steps.builder-image.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.builder-registry.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify published image catalog binding
        env:
          CATALOG_SHA256: ${{ steps.catalog.outputs.sha256 }}
          IMAGE_DIGEST: ${{ steps.image-result.outputs.digest }}
        run: |
          image="ghcr.io/voxelum/xmcl-shared-minecraft-runtime@$IMAGE_DIGEST"
          docker pull "$image" >/dev/null
          actual=$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "io.xmcl.runtime-catalog-sha256" }}')
          test "$actual" = "$CATALOG_SHA256"
      - name: Verify published builder identity
        env:
          BUILDER_DIGEST: ${{ steps.builder-image-result.outputs.digest }}
          TOOLCHAIN_REVISION: ${{ steps.catalog.outputs.toolchain }}
          RUNTIME_REVISION: ${{ steps.catalog.outputs.sha256 }}
        run: |
          image="ghcr.io/voxelum/xmcl-shared-node-builder@$BUILDER_DIGEST"
          docker pull "$image" >/dev/null
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.xmcl.builder.schema" }}')" = agent_builder_v1
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.xmcl.builder.toolchain-catalog-revision" }}')" = "$TOOLCHAIN_REVISION"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.xmcl.builder.runtime-catalog-revision" }}')" = "$RUNTIME_REVISION"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.xmcl.builder.target" }}')" = linux-amd64
      - name: Probe published Builder outer Docker boundary
        env:
          BUILDER_DIGEST: ${{ steps.builder-image-result.outputs.digest }}
          XMCL_BUILDER_DOCKER_LIVE_TEST: "1"
        run: |
          export XMCL_BUILDER_DOCKER_TEST_IMAGE="ghcr.io/voxelum/xmcl-shared-node-builder@$BUILDER_DIGEST"
          go test ./internal/docker \
            -run '^TestBuilder(OuterDockerSandbox|ProcessQuiescer)Live$' \
            -count=1 -v
      - name: Probe real offline NeoForge entrypoint and consume its output
        env:
          BUILDER_DIGEST: ${{ steps.builder-image-result.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.image-result.outputs.digest }}
          XMCL_BUILDER_DOCKER_LIVE_TEST: "1"
        run: |
          export XMCL_BUILDER_DOCKER_TEST_IMAGE="ghcr.io/voxelum/xmcl-shared-node-builder@$BUILDER_DIGEST"
          export XMCL_BUILDER_PROBE_RUNTIME_IMAGE="ghcr.io/voxelum/xmcl-shared-minecraft-runtime@$RUNTIME_DIGEST"
          export XMCL_BUILDER_PROBE_ROOT="$RUNNER_TEMP/builder-neoforge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'sudo rm -rf -- "$XMCL_BUILDER_PROBE_ROOT"' EXIT
          node compiler/scripts/materialize_builder_probe.mjs
          go test ./internal/docker -run '^TestBuilderEntrypointNeoForgeLive$' -count=1 -v -timeout=20m
          # The production agent runs as root; the hosted test user does not.
          # Change ownership only after the unmodified UID-10001 builder exits.
          sudo chown -R "$(id -u):$(id -g)" "$XMCL_BUILDER_PROBE_ROOT/output"
          go test ./internal/builder -run '^TestPublishedBuilderOutputLive$' -count=1 -v
      - name: Write cross-artifact release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image-result.outputs.digest }}
          BUILDER_IMAGE_DIGEST: ${{ steps.builder-image-result.outputs.digest }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/write_release_manifest.py \
            --commit "$GITHUB_SHA" \
            --tag "$RELEASE_TAG" \
            --image-digest "$IMAGE_DIGEST" \
            --builder-image-digest "$BUILDER_IMAGE_DIGEST" \
            --catalog runtime-image/runtime-catalog.lock.json \
            --toolchain-catalog compiler/toolchain-catalog.lock.json \
            --agent dist/xmcl-shared-node-agent-linux-amd64 \
            --agent-version-evidence dist/agent-version-evidence.json \
            --quota-helper dist/xmcl-quota-helper-linux-amd64 \
            --runtime dist/xmcl-shared-minecraft-runtime-linux-amd64 \
            --output dist/release-manifest.json
          (cd dist && sha256sum \
            xmcl-shared-node-agent-linux-amd64 \
            xmcl-quota-helper-linux-amd64 \
            xmcl-shared-minecraft-runtime-linux-amd64 \
            xmcl-lightnode-bootstrap-runner-linux-amd64.tar.gz \
            release-manifest.json \
            agent-version-evidence.json > SHA256SUMS)
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/xmcl-shared-node-agent-linux-amd64
            dist/xmcl-quota-helper-linux-amd64
            dist/xmcl-shared-minecraft-runtime-linux-amd64
            dist/xmcl-lightnode-bootstrap-runner-linux-amd64.tar.gz
            dist/release-manifest.json
            dist/agent-version-evidence.json
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/voxelum/xmcl-shared-minecraft-runtime
          subject-digest: ${{ steps.image-result.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/voxelum/xmcl-shared-node-builder
          subject-digest: ${{ steps.builder-image-result.outputs.digest }}
          push-to-registry: true
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "XMCL shared node runtime release $GITHUB_SHA" \
            dist/xmcl-shared-node-agent-linux-amd64 \
            dist/xmcl-quota-helper-linux-amd64 \
            dist/xmcl-shared-minecraft-runtime-linux-amd64 \
            dist/xmcl-lightnode-bootstrap-runner-linux-amd64.tar.gz \
            dist/release-manifest.json \
            dist/agent-version-evidence.json \
            dist/SHA256SUMS
